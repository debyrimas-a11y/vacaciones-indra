<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Control de Vacaciones - Débora</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; min-height: 100vh; padding: 20px; }
  .header { background: linear-gradient(135deg,#1e3a8a,#2563eb); border-radius: 14px; padding: 18px 24px; margin-bottom: 20px; display: flex; align-items: center; gap: 14px; }
  .header-icon { background: rgba(255,255,255,.15); border-radius: 10px; padding: 8px 14px; font-size: 22px; }
  .header h1 { color: #fff; font-size: 20px; font-weight: 800; }
  .header p { color: #93c5fd; font-size: 13px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .tab { padding: 8px 18px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; background: #fff; color: #374151; box-shadow: 0 1px 3px rgba(0,0,0,.07); transition: all .2s; }
  .tab.active { background: #2563eb; color: #fff; box-shadow: 0 2px 8px rgba(37,99,235,.3); }
  .filters { background: #fff; border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .filters span { font-size: 13px; font-weight: 600; color: #6b7280; }
  .filters select, .filters input[type=text] { padding: 6px 10px; border-radius: 7px; border: 1px solid #d1d5db; font-size: 13px; cursor: pointer; }
  .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 16px; }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
  .card-header h2 { font-size: 16px; font-weight: 700; }
  .card-header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-primary { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 8px 16px; cursor: pointer; font-weight: 600; font-size: 13px; }
  .btn-excel { background: #16a34a; color: #fff; border: none; border-radius: 8px; padding: 8px 16px; cursor: pointer; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .btn-excel:hover { background: #15803d; }
  .btn-secondary { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 12px; }
  .btn-danger { background: #fef2f2; color: #dc2626; border: none; border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 12px; }
  .btn-add-period { background: #eff6ff; color: #2563eb; border: none; border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { padding: 10px 12px; text-align: left; color: #6b7280; font-weight: 700; border-bottom: 2px solid #e5e7eb; background: #f8fafc; white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; }
  .badge { border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 600; white-space: nowrap; display: inline-block; }
  .actions { display: flex; gap: 6px; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: #fff; border-radius: 14px; padding: 28px; width: 420px; max-width: 95vw; box-shadow: 0 8px 32px rgba(0,0,0,.18); max-height: 90vh; overflow-y: auto; }
  .modal h3 { font-size: 17px; font-weight: 700; margin-bottom: 20px; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 4px; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 7px 10px; border-radius: 7px; border: 1px solid #d1d5db; font-size: 14px; font-family: inherit; }
  .form-group textarea { height: 70px; resize: vertical; }
  .form-hint { font-size: 11px; color: #9ca3af; margin-top: 3px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-actions button { padding: 8px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
  .modal-actions .cancel { border: 1px solid #e5e7eb; background: #f9fafb; color: #374151; }
  .modal-actions .save { border: none; background: #2563eb; color: #fff; }
  .days-preview { background: #eff6ff; border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; font-size: 13px; color: #2563eb; font-weight: 600; }
  .resumen-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .resumen-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .resumen-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .resumen-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px; }
  .progress-bar { background: #f1f5f9; border-radius: 8px; height: 10px; margin-top: 8px; }
  .progress-fill { border-radius: 8px; height: 10px; transition: width .4s; }
  .progress-label { font-size: 11px; color: #9ca3af; text-align: right; margin-top: 4px; }
  .cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .cal-nav button { border: 1px solid #e5e7eb; border-radius: 8px; padding: 6px 14px; cursor: pointer; background: #f9fafb; font-size: 16px; }
  .cal-nav span { font-weight: 700; font-size: 16px; }
  .legend { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .legend-dot { width: 14px; height: 14px; border-radius: 3px; }
  .empty { padding: 24px; text-align: center; color: #9ca3af; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .overflow-x { overflow-x: auto; }
  .cal-cell { width: 22px; height: 22px; border-radius: 4px; margin: 0 auto; }
  .hidden { display: none; }
  @media(max-width:600px){ .resumen-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">🏖️</div>
  <div>
    <h1>Control de Vacaciones</h1>
    <p id="headerSub">INDRA · 0 colaboradores</p>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="setTab('tabla')">👥 Personal</button>
  <button class="tab" onclick="setTab('periodos')">📋 Períodos</button>
  <button class="tab" onclick="setTab('calendario')">📅 Calendario</button>
  <button class="tab" onclick="setTab('resumen')">📊 Resumen</button>
</div>

<div class="filters">
  <span>Filtros:</span>
  <select id="fRol" onchange="render()"><option>Todos</option><option>Big Data</option><option>Cloud</option></select>
  <input type="text" id="fSQ" placeholder="Filtrar por SQ..." oninput="render()" style="width:200px"/>
  <select id="fFocal" onchange="render()"></select>
  <select id="fEstado" onchange="render()"></select>
</div>

<div id="content"></div>

<!-- Modal Empleado -->
<div class="overlay hidden" id="empModal">
  <div class="modal">
    <h3 id="empModalTitle">Agregar colaborador</h3>
    <div class="form-group"><label>Nombre completo</label><input type="text" id="empNombre"/></div>
    <div class="form-group"><label>Rol</label><select id="empRol"><option>Big Data</option><option>Cloud</option></select></div>
    <div class="form-group">
      <label>SQ</label>
      <input type="text" id="empSQ" placeholder="Escribe el nombre del SQ..." list="sqSuggestions"/>
      <datalist id="sqSuggestions"></datalist>
      <div class="form-hint">Puedes escribir libremente o elegir una sugerencia</div>
    </div>
    <div class="form-group"><label>Focal</label><select id="empFocal"></select></div>
    <div class="form-group"><label>Días asignados</label><input type="number" id="empDias" value="30"/></div>
    <div class="form-group"><label>Comentarios</label><textarea id="empComentarios"></textarea></div>
    <div class="modal-actions">
      <button class="cancel" onclick="closeEmpModal()">Cancelar</button>
      <button class="save" onclick="saveEmp()">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal Período -->
<div class="overlay hidden" id="periodModal">
  <div class="modal">
    <h3 id="periodModalTitle">Agregar período de vacaciones</h3>
    <div class="form-group"><label>Colaborador</label><select id="pEmp"></select></div>
    <div class="form-group"><label>Fecha inicio</label><input type="date" id="pInicio" oninput="updateDaysPreview()"/></div>
    <div class="form-group"><label>Fecha fin</label><input type="date" id="pFin" oninput="updateDaysPreview()"/></div>
    <div id="daysPreview" class="days-preview hidden"></div>
    <div class="form-group"><label>Estado</label><select id="pEstado"></select></div>
    <div class="form-group"><label>Comentario</label><textarea id="pComentario"></textarea></div>
    <div class="modal-actions">
      <button class="cancel" onclick="closePeriodModal()">Cancelar</button>
      <button class="save" onclick="savePeriod()">Guardar</button>
    </div>
  </div>
</div>

<script>
const SQ_SUGGESTIONS = [
  "DWH","SQUAD SPEEDUP","ACTIVOS, PASIVOS Y CAPITAL & CAMBIOS",
  "CONTINUIDAD OPERATIVA","LONDON","MIGRACIÓN CLOUD",
  "PROY. EVOLUCION DATAWAREHOUSE","Proyecto Evolución Datawarehouse",
  "SQ DATA","SQ DATA PARA MODELOS DE RIESGO DE CREDIT",
  "SQ PLATAFORMA ANALITICAS Y CONSUMO DATOS",
  "SQ SALESFORCE - CORPORACIONES Y EMPRESAS",
  "UNIDAD GEST Y DESHERRA DE INFORMACION","YAKU"
];
const FCL = ["Débora Rimas","Roxana Castro","Eduardo Escusa","Alan Mato","Johana Loayza"];
const ESTADOS = ["Cumpleaños","Lic. Maternidad","Fmto Fam","Dscso Med","Solicitado","Reportado a INDRA","En proceso de Goce","Finalizada"];
const ESTADO_COLOR = {
  "Cumpleaños":"#ffd700","Lic. Maternidad":"#c464ae","Fmto Fam":"#a1a09d",
  "Dscso Med":"#912c3d","Solicitado":"#f59e0b","Reportado a INDRA":"#3b82f6",
  "En proceso de Goce":"#8b5cf6","Finalizada":"#10b981"
};
const ROL_COLOR = {"Big Data":"#0ea5e9","Cloud":"#f97316"};
const SCRIPT_URL = "/api/save";

async function saveToStorage() {
  try {
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "saveAll", employees, periods })
    });
    const data = await res.json();
    if (data.ok) console.log("✅ Guardado en Google Sheets");
    else console.error("❌ Error:", data.error);
  } catch(err) { console.error("Error al guardar:", err); }
}

async function loadFromStorage() {
  try {
    document.getElementById("content").innerHTML =
      '<div style="text-align:center;padding:40px;color:#6b7280">⏳ Cargando datos...</div>';
    const res = await fetch(SCRIPT_URL + "?action=getAll");
    const data = await res.json();
    if (data.employees) employees = data.employees.map(e => ({...e, id: Number(e.id), diasAsignados: Number(e.diasAsignados)}));
    if (data.periods)   periods   = data.periods.map(p => ({...p, id: Number(p.id), empleadoId: Number(p.empleadoId)}));
  } catch(err) { console.error("Error al cargar:", err); }
}

let employees = [];
let periods = [];
let currentTab = "tabla";
let editEmpId = null;
let editPeriodId = null;
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();

function diffDays(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000) + 1; }
function diasUsados(empId) { return periods.filter(p => p.empleadoId === empId).reduce((s,p) => s + diffDays(p.inicio, p.fin), 0); }
function badge(text, color) { return `<span class="badge" style="background:${color}22;color:${color};border:1px solid ${color}55">${text}</span>`; }

function initSelects() {
  document.getElementById("fFocal").innerHTML = '<option>Todos</option>' + FCL.map(s=>`<option>${s}</option>`).join('');
  document.getElementById("fEstado").innerHTML = '<option>Todos</option>' + ESTADOS.map(s=>`<option>${s}</option>`).join('');
  document.getElementById("empFocal").innerHTML = FCL.map(s=>`<option>${s}</option>`).join('');
  document.getElementById("pEstado").innerHTML = ESTADOS.map(s=>`<option>${s}</option>`).join('');
  // Sugerencias para el datalist de SQ
  document.getElementById("sqSuggestions").innerHTML = SQ_SUGGESTIONS.map(s=>`<option value="${s}"></option>`).join('');
}

function setTab(t) {
  currentTab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab')[["tabla","periodos","calendario","resumen"].indexOf(t)].classList.add('active');
  document.getElementById("fEstado").style.display = (t === "periodos") ? "" : "none";
  render();
}

function getFilters() {
  return {
    rol: document.getElementById("fRol").value,
    sq: document.getElementById("fSQ").value.trim().toLowerCase(),
    focal: document.getElementById("fFocal").value,
    estado: document.getElementById("fEstado").value,
  };
}
function empMatches(e, f) {
  return (f.rol==="Todos"||e.rol===f.rol) &&
         (f.sq===""||e.sq.toLowerCase().includes(f.sq)) &&
         (f.focal==="Todos"||e.focal===f.focal);
}

function render() {
  document.getElementById("headerSub").textContent = `INDRA · ${employees.length} colaboradores`;
  const f = getFilters();
  const filtEmps = employees.filter(e => empMatches(e, f));
  const filtPeriods = periods.filter(p => {
    const e = employees.find(x=>x.id===p.empleadoId);
    return e && empMatches(e,f) && (f.estado==="Todos"||p.estado===f.estado);
  });
  let html = "";
  if (currentTab === "tabla") html = renderTabla(filtEmps);
  else if (currentTab === "periodos") html = renderPeriodos(filtPeriods);
  else if (currentTab === "calendario") html = renderCalendario(filtEmps);
  else if (currentTab === "resumen") html = renderResumen();
  document.getElementById("content").innerHTML = html;
}

function renderTabla(emps) {
  const rows = emps.map(e => {
    const usados = diasUsados(e.id);
    const disp = e.diasAsignados - usados;
    return `<tr>
      <td><strong>${e.nombre}</strong></td>
      <td>${badge(e.rol, ROL_COLOR[e.rol])}</td>
      <td style="max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${e.sq}">${e.sq}</td>
      <td>${e.focal}</td>
      <td style="text-align:center">${e.diasAsignados}</td>
      <td style="text-align:center;color:#dc2626;font-weight:700">${usados}</td>
      <td style="text-align:center;font-weight:700;color:${disp<5?'#dc2626':'#10b981'}">${disp}</td>
      <td style="color:#6b7280;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.comentarios||"—"}</td>
      <td><div class="actions">
        <button class="btn-add-period" onclick="openAddPeriod(${e.id})">+ Período</button>
        <button class="btn-secondary" onclick="openEditEmp(${e.id})">✏️</button>
        <button class="btn-danger" onclick="deleteEmp(${e.id})">🗑️</button>
      </div></td>
    </tr>`;
  }).join('');
  return `<div class="card">
    <div class="card-header"><h2>Personal del equipo</h2><button class="btn-primary" onclick="openAddEmp()">+ Agregar persona</button></div>
    <div class="overflow-x"><table>
      <thead><tr>${["Nombre","Rol","SQ","Focal","Días Asig.","Días Usados","Disponibles","Comentarios","Acciones"].map(h=>`<th>${h}</th>`).join('')}</tr></thead>
      <tbody>${rows||`<tr><td colspan="9" class="empty">Sin resultados</td></tr>`}</tbody>
    </table></div></div>`;
}

function renderPeriodos(prds) {
  const rows = prds.map(p => {
    const e = employees.find(x=>x.id===p.empleadoId);
    if (!e) return '';
    return `<tr>
      <td><strong>${e.nombre}</strong></td>
      <td>${badge(e.rol,ROL_COLOR[e.rol])}</td>
      <td>${p.inicio}</td><td>${p.fin}</td>
      <td style="text-align:center;font-weight:700">${diffDays(p.inicio,p.fin)}</td>
      <td>${badge(p.estado,ESTADO_COLOR[p.estado])}</td>
      <td style="color:#6b7280">${p.comentario||"—"}</td>
      <td><div class="actions">
        <button class="btn-secondary" onclick="openEditPeriod(${p.id})">✏️</button>
        <button class="btn-danger" onclick="deletePeriod(${p.id})">🗑️</button>
      </div></td>
    </tr>`;
  }).join('');
  return `<div class="card">
    <div class="card-header"><h2>Períodos de vacaciones</h2><button class="btn-primary" onclick="openAddPeriod(null)">+ Agregar período</button></div>
    <div class="overflow-x"><table>
      <thead><tr>${["Colaborador","Rol","Inicio","Fin","Días","Estado","Comentario","Acciones"].map(h=>`<th>${h}</th>`).join('')}</tr></thead>
      <tbody>${rows||`<tr><td colspan="8" class="empty">No hay períodos registrados</td></tr>`}</tbody>
    </table></div></div>`;
}

function renderCalendario(emps) {
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const monthName = new Date(calYear, calMonth, 1).toLocaleString('es',{month:'long',year:'numeric'});
  const headers = Array.from({length:daysInMonth},(_,i)=>{
    const d = new Date(calYear,calMonth,i+1);
    const we = d.getDay()===0||d.getDay()===6;
    return `<th style="padding:6px 3px;text-align:center;color:${we?'#9ca3af':'#374151'};min-width:26px;font-size:11px">${i+1}</th>`;
  }).join('');

  const rows = emps.map(e => {
    const cells = Array.from({length:daysInMonth},(_,i)=>{
      const day = i+1;
      const d = new Date(calYear,calMonth,day);
      const p = periods.find(p => {
        if(p.empleadoId!==e.id) return false;
        return d>=new Date(p.inicio) && d<=new Date(p.fin);
      });
      const we = d.getDay()===0||d.getDay()===6;
      if(p) {
        const c = ESTADO_COLOR[p.estado];
        return `<td style="padding:3px 2px;background:${c}22" title="${p.estado}"><div class="cal-cell" style="background:${c}"></div></td>`;
      }
      return `<td style="background:${we?'#f9fafb':'transparent'}"></td>`;
    }).join('');
    return `<tr>
      <td style="padding:6px 10px;font-weight:600;white-space:nowrap;min-width:140px">
        ${e.nombre}<br><span style="font-size:11px;color:${ROL_COLOR[e.rol]};font-weight:600">${e.rol}</span>
      </td>${cells}</tr>`;
  }).join('');

  const legend = Object.entries(ESTADO_COLOR).map(([k,v])=>
    `<div class="legend-item"><div class="legend-dot" style="background:${v}"></div><span>${k}</span></div>`
  ).join('');

  return `<div class="card">
    <div class="cal-nav">
      <button onclick="calPrev()">‹</button>
      <span>${monthName}</span>
      <button onclick="calNext()">›</button>
    </div>
    <div class="card-header" style="margin-bottom:12px">
      <span style="font-size:13px;color:#6b7280">Vista mensual del equipo</span>
      <button class="btn-excel" onclick="exportCalendarioExcel()">📥 Exportar Excel</button>
    </div>
    <div class="overflow-x"><table id="calTable">
      <thead><tr><th style="padding:8px 10px;text-align:left;background:#f8fafc;border-bottom:2px solid #e5e7eb;min-width:140px">Colaborador</th>${headers}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="legend">${legend}</div>
  </div>`;
}

// ── EXPORTAR CALENDARIO A EXCEL ──
function exportCalendarioExcel() {
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const monthName = new Date(calYear, calMonth, 1).toLocaleString('es',{month:'long',year:'numeric'});
  const f = getFilters();
  const emps = employees.filter(e => empMatches(e, f));

  // Encabezados
  const headers = ["Colaborador", "Rol", "SQ"];
  for (let d = 1; d <= daysInMonth; d++) headers.push(String(d));
  headers.push("Total días de ausencia");

  const rows = emps.map(e => {
    const row = [e.nombre, e.rol, e.sq];
    let total = 0;
    for (let d = 1; d <= daysInMonth; d++) {
      const date = new Date(calYear, calMonth, d);
      const p = periods.find(p => {
        if (p.empleadoId !== e.id) return false;
        return date >= new Date(p.inicio) && date <= new Date(p.fin);
      });
      if (p) { row.push(p.estado); total++; }
      else row.push("");
    }
    row.push(total);
    return row;
  });

  // Construir CSV con BOM para que Excel lo abra bien
  const bom = "\uFEFF";
  const csv = bom + [headers, ...rows]
    .map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(","))
    .join("\n");

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `Calendario_Vacaciones_${monthName.replace(/ /g,'_')}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function renderResumen() {
  const cards = ["Big Data","Cloud"].map(rol => {
    const emps = employees.filter(e=>e.rol===rol);
    const totalAsig = emps.reduce((s,e)=>s+e.diasAsignados,0);
    const totalUsados = emps.reduce((s,e)=>s+diasUsados(e.id),0);
    const disp = totalAsig - totalUsados;
    const pct = totalAsig ? Math.round((totalUsados/totalAsig)*100) : 0;
    const c = ROL_COLOR[rol];
    return `<div class="resumen-card">
      <h3><span class="dot" style="background:${c}"></span>${rol} <span style="color:#6b7280;font-size:13px;font-weight:400">(${emps.length} personas)</span></h3>
      <div class="resumen-row"><span style="color:#6b7280">Días asignados</span><strong>${totalAsig}</strong></div>
      <div class="resumen-row"><span style="color:#6b7280">Días usados</span><strong style="color:#dc2626">${totalUsados}</strong></div>
      <div class="resumen-row"><span style="color:#6b7280">Días disponibles</span><strong style="color:#10b981">${disp}</strong></div>
      <div class="progress-bar"><div class="progress-fill" style="background:${c};width:${pct}%"></div></div>
      <div class="progress-label">${pct}% utilizado</div>
    </div>`;
  }).join('');

  const indRows = employees.map(e => {
    const usados = diasUsados(e.id);
    const disp = e.diasAsignados - usados;
    const pct = e.diasAsignados ? Math.round((usados/e.diasAsignados)*100) : 0;
    return `<tr>
      <td><strong>${e.nombre}</strong></td>
      <td>${badge(e.rol,ROL_COLOR[e.rol])}</td>
      <td style="max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${e.sq}">${e.sq}</td>
      <td>${e.focal}</td>
      <td style="text-align:center">${e.diasAsignados}</td>
      <td style="text-align:center;color:#dc2626;font-weight:700">${usados}</td>
      <td style="text-align:center;font-weight:700;color:${disp<5?'#dc2626':'#10b981'}">${disp}</td>
      <td style="min-width:120px">
        <div style="display:flex;align-items:center;gap:6px">
          <div style="background:#f1f5f9;border-radius:4px;height:8px;flex:1">
            <div style="background:${pct>80?'#dc2626':'#2563eb'};border-radius:4px;height:8px;width:${pct}%"></div>
          </div>
          <span style="font-size:12px;color:#6b7280;min-width:30px">${pct}%</span>
        </div>
      </td>
    </tr>`;
  }).join('');

  return `<div class="resumen-grid">${cards}</div>
  <div class="card" style="margin-top:16px">
    <div class="card-header"><h2>Resumen individual</h2></div>
    <div class="overflow-x"><table>
      <thead><tr>${["Nombre","Rol","SQ","Focal","Asignados","Usados","Disponibles","% Uso"].map(h=>`<th>${h}</th>`).join('')}</tr></thead>
      <tbody>${indRows}</tbody>
    </table></div>
  </div>`;
}

function calPrev() { calMonth--; if(calMonth<0){calMonth=11;calYear--;} render(); }
function calNext() { calMonth++; if(calMonth>11){calMonth=0;calYear++;} render(); }

function openAddEmp() {
  editEmpId = null;
  document.getElementById("empModalTitle").textContent = "Agregar colaborador";
  document.getElementById("empNombre").value = "";
  document.getElementById("empRol").value = "Big Data";
  document.getElementById("empSQ").value = "";
  document.getElementById("empFocal").value = FCL[0];
  document.getElementById("empDias").value = 30;
  document.getElementById("empComentarios").value = "";
  document.getElementById("empModal").classList.remove("hidden");
}
function openEditEmp(id) {
  const e = employees.find(x=>x.id===id);
  editEmpId = id;
  document.getElementById("empModalTitle").textContent = "Editar colaborador";
  document.getElementById("empNombre").value = e.nombre;
  document.getElementById("empRol").value = e.rol;
  document.getElementById("empSQ").value = e.sq;   // ← texto libre, mantiene el valor existente
  document.getElementById("empFocal").value = e.focal;
  document.getElementById("empDias").value = e.diasAsignados;
  document.getElementById("empComentarios").value = e.comentarios;
  document.getElementById("empModal").classList.remove("hidden");
}
function closeEmpModal() { document.getElementById("empModal").classList.add("hidden"); }
function saveEmp() {
  const nombre = document.getElementById("empNombre").value.trim();
  if (!nombre) return alert("El nombre es obligatorio");
  const sq = document.getElementById("empSQ").value.trim();
  if (!sq) return alert("El SQ es obligatorio");
  const data = {
    nombre, rol: document.getElementById("empRol").value,
    sq,
    focal: document.getElementById("empFocal").value,
    diasAsignados: parseInt(document.getElementById("empDias").value)||30,
    comentarios: document.getElementById("empComentarios").value
  };
  if (editEmpId) {
    employees = employees.map(e => e.id===editEmpId ? {...data, id:editEmpId} : e);
  } else {
    employees.push({...data, id: Date.now()});
  }
  closeEmpModal(); saveToStorage(); render();
}
function deleteEmp(id) {
  if (!confirm("¿Eliminar este colaborador?")) return;
  employees = employees.filter(e=>e.id!==id);
  periods = periods.filter(p=>p.empleadoId!==id);
  saveToStorage(); render();
}

function populatePEmp(selectedId) {
  const sel = document.getElementById("pEmp");
  sel.innerHTML = employees.map(e=>`<option value="${e.id}">${e.nombre}</option>`).join('');
  if (selectedId) sel.value = selectedId;
}
function openAddPeriod(empId) {
  editPeriodId = null;
  document.getElementById("periodModalTitle").textContent = "Agregar período de vacaciones";
  populatePEmp(empId);
  document.getElementById("pInicio").value = "";
  document.getElementById("pFin").value = "";
  document.getElementById("pEstado").value = ESTADOS[0];
  document.getElementById("pComentario").value = "";
  document.getElementById("daysPreview").classList.add("hidden");
  document.getElementById("periodModal").classList.remove("hidden");
}
function openEditPeriod(id) {
  const p = periods.find(x=>x.id===id);
  editPeriodId = id;
  document.getElementById("periodModalTitle").textContent = "Editar período de vacaciones";
  populatePEmp(p.empleadoId);
  document.getElementById("pInicio").value = p.inicio;
  document.getElementById("pFin").value = p.fin;
  document.getElementById("pEstado").value = p.estado;
  document.getElementById("pComentario").value = p.comentario;
  updateDaysPreview();
  document.getElementById("periodModal").classList.remove("hidden");
}
function closePeriodModal() { document.getElementById("periodModal").classList.add("hidden"); }
function updateDaysPreview() {
  const ini = document.getElementById("pInicio").value;
  const fin = document.getElementById("pFin").value;
  const preview = document.getElementById("daysPreview");
  if (ini && fin && new Date(fin)>=new Date(ini)) {
    preview.textContent = `📅 ${diffDays(ini,fin)} días`;
    preview.classList.remove("hidden");
  } else { preview.classList.add("hidden"); }
}
function savePeriod() {
  const empId = parseInt(document.getElementById("pEmp").value);
  const ini = document.getElementById("pInicio").value;
  const fin = document.getElementById("pFin").value;
  if (!ini || !fin) return alert("Las fechas son obligatorias");
  if (new Date(fin) < new Date(ini)) return alert("La fecha fin debe ser mayor o igual a la fecha inicio");
  const data = { empleadoId:empId, inicio:ini, fin, estado:document.getElementById("pEstado").value, comentario:document.getElementById("pComentario").value };
  if (editPeriodId) {
    periods = periods.map(p => p.id===editPeriodId ? {...data, id:editPeriodId} : p);
  } else {
    periods.push({...data, id:Date.now()});
  }
  closePeriodModal(); saveToStorage(); render();
}
function deletePeriod(id) {
  if (!confirm("¿Eliminar este período?")) return;
  periods = periods.filter(p=>p.id!==id);
  saveToStorage(); render();
}

async function init() {
  await loadFromStorage();
  initSelects();
  document.getElementById("fEstado").style.display = "none";
  render();
}
init();
</script>
</body>
</html>
